name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # Everything here is cheap to check and expensive to get wrong: a release
      # that ships with a stale version string, or one Sparkle cannot verify,
      # is only discovered by the users who fail to update.
      - name: Preflight
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}

          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)
          CORE=$(grep -o '"[0-9][^"]*"' Sources/AppMeterCore/CoreInfo.swift | tr -d '"')

          # The menu bar reads CoreInfo.version; Sparkle and Finder read the
          # plist. Two sources for one fact, so they get compared.
          if [ "$CORE" != "$SHORT" ]; then
            echo "CoreInfo.version ($CORE) != CFBundleShortVersionString ($SHORT)" >&2
            exit 1
          fi
          if [ "$SHORT" != "$VERSION" ]; then
            echo "CFBundleShortVersionString ($SHORT) != tag ($VERSION)" >&2
            exit 1
          fi

          # Without this key Sparkle accepts the feed and then rejects every
          # download it signature-checks — an update mechanism that looks alive
          # and silently never updates anyone.
          if ! /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" Resources/Info.plist >/dev/null 2>&1; then
            echo "Info.plist has no SUPublicEDKey — run Sparkle's generate_keys and add the public half" >&2
            exit 1
          fi

          # CFBundleVersion is what Sparkle actually compares. Left unbumped, the
          # release publishes fine and no installed copy ever offers it.
          PREV=$(grep -o '<sparkle:version>[0-9]*' appcast.xml | grep -o '[0-9]*' | head -1 || true)
          if [ -n "$PREV" ] && [ "$BUNDLE" -le "$PREV" ]; then
            echo "CFBundleVersion ($BUNDLE) must be greater than the released one ($PREV)" >&2
            exit 1
          fi

          echo "Releasing $TAG — short $SHORT, bundle $BUNDLE"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/cert.p12

      # Sparkle pulls a binary framework; a stale SwiftPM cache occasionally
      # resolves the wrong artifact in CI. Clearing it keeps builds reproducible.
      - name: Clear stale SwiftPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Build release binary
        run: swift build -c release --disable-sandbox

      # `make app` assembles the same bundle with an ad-hoc signature, which is
      # right for a local build and useless for distribution. The assembly is
      # repeated here rather than parameterised because the signing below is not
      # one identity swap: Sparkle's nested helpers each need the hardened
      # runtime and their own pass, inside-out.
      - name: Assemble and sign app bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="dist/App Meter.app"
          mkdir -p "$APP/Contents/MacOS"
          cp .build/release/AppMeter "$APP/Contents/MacOS/AppMeter"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          mkdir -p "$APP/Contents/Resources"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          mkdir -p "$APP/Contents/Frameworks"
          cp -R .build/release/Sparkle.framework "$APP/Contents/Frameworks/Sparkle.framework"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/AppMeter"

          SIGN="Developer ID Application: Serhii Bezbabnykh ($APPLE_TEAM_ID)"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"

          codesign --force --options runtime --preserve-metadata=entitlements,identifier \
            --sign "$SIGN" "$SPARKLE/XPCServices/Downloader.xpc"
          codesign --force --options runtime --preserve-metadata=entitlements,identifier \
            --sign "$SIGN" "$SPARKLE/XPCServices/Installer.xpc"
          codesign --force --options runtime --sign "$SIGN" "$SPARKLE/Autoupdate"
          codesign --force --options runtime --sign "$SIGN" "$SPARKLE/Updater.app"
          codesign --force --options runtime --sign "$SIGN" \
            "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --sign "$SIGN" "$APP"

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_contents
          cp -R "dist/App Meter.app" dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create \
            -volname "App Meter" \
            -srcfolder dist/dmg_contents \
            -ov -format UDZO \
            dist/AppMeter.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/AppMeter.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple dist/AppMeter.dmg

      - name: Sign DMG for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 -m venv /tmp/sparkle-venv
          /tmp/sparkle-venv/bin/pip install cryptography --quiet
          /tmp/sparkle-venv/bin/python3 << 'PYEOF' >> "$GITHUB_ENV"
          import base64, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY']))
          data = open('dist/AppMeter.dmg', 'rb').read()
          sig = base64.b64encode(key.sign(data)).decode()
          print(f'ED_SIG={sig}')
          print(f'DMG_LENGTH={len(data)}')
          PYEOF

      # The feed carries one item, the newest: Sparkle only ever compares the
      # installed build against the best candidate, so a growing history of
      # superseded releases would be weight with no reader.
      - name: Update appcast.xml
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DMG_URL="https://github.com/TadelUnso/app-meter/releases/download/${TAG}/AppMeter.dmg"
          BUNDLE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)

          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>App Meter</title>
                  <link>https://github.com/TadelUnso/app-meter</link>
                  <description>Install counts desktop widget for macOS</description>
                  <language>en</language>
                  <item>
                      <title>App Meter ${VERSION}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${BUNDLE_VER}</sparkle:version>
                      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                      <enclosure
                          url="${DMG_URL}"
                          length="${DMG_LENGTH}"
                          type="application/octet-stream"
                          sparkle:edSignature="${ED_SIG}"
                      />
                  </item>
              </channel>
          </rss>
          EOF

          git config user.email "tadelunso@gmail.com"
          git config user.name "Serhii Bezbabnykh"
          git add appcast.xml
          git commit -m "chore: update appcast.xml for ${TAG}"
          git push origin HEAD:main

      - name: Create release and upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" --title "$TAG" --generate-notes dist/AppMeter.dmg
